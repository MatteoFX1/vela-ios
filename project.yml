# XcodeGen spec: the build workflow turns this into Vela.xcodeproj (`xcodegen generate`).
name: Vela
options:
  bundleIdPrefix: app.vela
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
  VelaCore:
    path: VelaCore
targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: MapLibre
      - package: VelaCore
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Vela shows where you are on the map, finds places near you and guides you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: Vela keeps guiding you with the screen off during navigation.
        NSMicrophoneUsageDescription: Vela listens when you tap the microphone to search by voice.
        NSSpeechRecognitionUsageDescription: Vela turns what you say into a search.
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "1"
