name: Build iPhone app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Check search code
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test
      - name: Live Google search check
        working-directory: VelaCore
        continue-on-error: true
        run: swift run vela-probe "pizza" 40.7484 -73.9857

  ipa:
    name: Build Vela.ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      - name: Ad-hoc sign
        # An app with no signature at all is read as broken by some sideloaders. An ad-hoc
        # signature fixes that; the sideloader still re-signs with your Apple ID.
        run: |
          APP=build/Build/Products/Release-iphoneos/Vela.app
          for f in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package .ipa
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Vela.app Payload/Vela.app
          zip -qr -X Vela.ipa Payload
          unzip -l Vela.ipa | tail -n 3
          unzip -tq Vela.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Vela-ipa
          path: Vela.ipa
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vela for iPhone (build ${{ github.run_number }})
          body: |
            Unsigned app for sideloading. Download **Vela.ipa** below and install it with AltStore or Sideloadly.
          files: Vela.ipa

  screens:
    name: Screenshots (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Vela.xcodeproj -scheme Vela -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -n 20 build.log; exit 1; }
          tail -n 5 build.log
      - name: Take screenshots
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone 16') or x['name'].startswith('iPhone 15')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl location "$DEV" set 38.5449,-121.7405
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/Vela.app
          xcrun simctl privacy "$DEV" grant location app.vela.ios || true
          mkdir -p shots
          for step in browse search place directions nav cameras layers transit board mine stops rail welcome camalert streetview svtest svtest90 lookaround copy wazelink googlelink; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            case $step in browse) t=16;; search) t=24;; place) t=28;; directions) t=38;; nav) t=44;; cameras) t=110;; layers) t=12;; transit) t=40;; board) t=24;; mine) t=14;; stops) t=40;; rail) t=30;; welcome) t=10;; camalert) t=52;; streetview) t=40;; svtest) t=12;; svtest90) t=12;; lookaround) t=40;; copy) t=34;; wazelink) t=16;; googlelink) t=24;; esac
            sleep $t
            xcrun simctl io "$DEV" screenshot "shots/$step.png"
          done
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo place
          sleep 28
          xcrun simctl io "$DEV" screenshot shots/place-light.png
          xcrun simctl location "$DEV" set 56.4120,-3.4700
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo uk
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/uk.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Save screenshots to the ci-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Only a convenience for reviewing; never fails the build.
        continue-on-error: true
        run: |
          cd shots
          for f in *.png; do sips -s format jpeg -s formatOptions 70 -Z 1200 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f *.png
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
